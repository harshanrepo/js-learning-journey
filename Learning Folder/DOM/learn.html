<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <button onclick="done()">Hi!</button>
    <button onclick="clickMe()" class="kick">Kick me</button>
    <script>
        function done(){
        document.querySelector('button').innerHTML="Goooooood"
        }
        function clickMe(){
            document.querySelector('.kick').innerHTML="Oouch"
        }
    </script>
</body>
</html>
