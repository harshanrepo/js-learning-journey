<!DOCTYPE html>
<html>

<head>
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="Rock-Paper-Scissor.css">
</head>

<body>
    <p class="title">Rock-Paper-Scissors</p>

    <button onclick="playGame('Rock') ;" class="playerMove"><img src="images/Rock-emoji.png" class="move-icon"></button>
    <button onclick="playGame('Paper');" class="playerMove"><img src="images/Paper-emoji.png" class="move-icon"></button>
    <button onclick="playGame('Scissors');" class="playerMove"><img src="images/Scissors-emoji.png" class="move-icon"></button>
    <p class="score_result"></p>
    <p class="score_show"></p>
    <p class="score_points"></p>
    <button onclick="resetScore()" class="resetScore">Reset Score</button>   

    <script src="Rock-Paper-Scissor.js"></script>
</body>

</html>
