<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booleans</title>
</head>
<body>
    <p>Rock - Paper - Scissors</p>
    <button onclick="playGame('Rock')">Rock</button>
    <button onclick="playGame('Paper')">Paper</button>
    <button onclick="playGame('Scissors')">Scissors</button>
    <script>

        function randomNumberGenerator(){
            let randomNumber = Math.random();

            if (randomNumber > 0 && randomNumber <1/3){
                return "Rock";
            }
            else if(randomNumber > 1/3 && randomNumber < 2/3){
                return "Paper";
            }
            else{
                return "Scissors";
            }
        }

        function playGame(Playermove){
            const computerMove = randomNumberGenerator();

            if(computerMove === Playermove){
                alert(`You picked ${Playermove} and the computer picked ${computerMove}. It's a tie!`);
            }
            else if((Playermove === "Rock" && computerMove === "Scissors") || 
                    (Playermove === "Paper" && computerMove === "Rock") || 
                    (Playermove === "Scissors" && computerMove === "Paper")){
                alert(`You picked ${Playermove} and the computer picked ${computerMove}. You win!`);
            }
            else{
                alert(`You picked ${Playermove} and the computer picked ${computerMove}. You lose!`);
            }
        }
    </script>
</body>
</html>
